            schema:
              $ref: "#/components/schemas/TrayInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tray"
    delete:
      operationId: deleteTray
      tags: [trays]
      summary: Inactivate a tray
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tray"

  /labs:
    get:
      operationId: listLabs
      tags: [labs]
