          schema: { type: string }
        - name: program
          in: query
          schema: { type: string }
        - name: destination
          in: query
          schema: { type: string }
        - name: shipped
          in: query
          schema: { type: string, enum: ["true", "false"] }
        - name: page
          in: query
          schema: { type: integer }
        - name: pageSize
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated shipping list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShippingRecord"
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  totalPages:
                    type: integer

  /shipping/totals:
    get:
      operationId: getShippingTotals
      tags: [shipping]
      summary: Get shipping totals
      parameters:
        - name: berryId
          in: query
          schema: { type: integer }
        - name: teamId
          in: query
          schema: { type: integer }
        - name: pollinationYear
          in: query
          schema: { type: integer }
        - name: progeny
          in: query
          schema: { type: string }
        - name: program
          in: query
          schema: { type: string }
        - name: destination
          in: query
          schema: { type: string }
        - name: shipped
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Shipping totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingTotals"

  /shipping/destinations:
    get:
      operationId: listShippingDestinations
      tags: [shipping]
      summary: List distinct shipping destinations
      responses:
        "200":
          description: List of destination names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /shipping/allocation:
    get:
      operationId: listSortGroupAllocation
      tags: [shipping]
      summary: List per-progeny Sort Group totals with D1/D2 destinations and persisted splits
      parameters:
        - name: berryId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: pollinationYear
          in: query
          schema:
            type: integer
        - name: progeny
          in: query
          schema:
            type: string
        - name: program
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sort Group Allocation rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SortGroupAllocationRow"
                required:
                  - data
    patch:
      operationId: saveSortGroupAllocation
      tags: [shipping]
      summary: Upsert per-destination Sort Group splits for one or more progenies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - updates
              properties:
                updates:
                  type: array
                  items:
                    $ref: "#/components/schemas/SortGroupAllocationUpdate"
      responses:
        "200":
          description: Number of upserted side-rows (D1 + D2 per progeny)
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer

