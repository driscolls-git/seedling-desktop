                  $ref: "#/components/schemas/Lab"
    post:
      operationId: createLab
      tags: [labs]
      summary: Create a lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lab"

  /labs/{id}:
    put:
      operationId: updateLab
      tags: [labs]
      summary: Update a lab
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lab"
    delete:
      operationId: deleteLab
      tags: [labs]
      summary: Inactivate a lab
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lab"

  /transplant-instructions:
    get:
      operationId: listTransplantInstructions
      tags: [transplantInstructions]
      summary: List transplant instructions
      responses:
        "200":
          description: Instructions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransplantInstruction"
    post:
      operationId: createTransplantInstruction
      tags: [transplantInstructions]
      summary: Create a transplant instruction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransplantInstructionInput"
      responses:
