    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"

  /locations/{id}:
    put:
      operationId: updateLocation
      tags: [locations]
      summary: Update a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      operationId: deleteLocation
      tags: [locations]
      summary: Delete a location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ratios:
    get:
      operationId: listRatios
      tags: [ratios]
      summary: List propagation ratios
      parameters:
        - name: berryId
          in: query
          schema:
            type: integer
        - name: programId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Ratios list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ratio"
    post:
      operationId: createRatio
      tags: [ratios]
      summary: Create a ratio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ratio"

  /ratios/{id}:
    put:
      operationId: updateRatio
      tags: [ratios]
      summary: Update a ratio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatioInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ratio"
    delete:
      operationId: deleteRatio
      tags: [ratios]
      summary: Delete a ratio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /trays:
    get:
      operationId: listTrays
      tags: [trays]
      summary: List tray sizes
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Tray list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tray"
    post:
      operationId: createTray
      tags: [trays]
      summary: Create a tray size
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrayInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tray"

  /trays/{id}:
    put:
      operationId: updateTray
      tags: [trays]
