          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransplantInstruction"

  /transplant-instructions/{id}:
    put:
      operationId: updateTransplantInstruction
      tags: [transplantInstructions]
      summary: Update a transplant instruction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransplantInstructionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransplantInstruction"
    delete:
      operationId: deleteTransplantInstruction
      tags: [transplantInstructions]
      summary: Delete a transplant instruction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - name: teamId
          in: query
          schema:
            type: integer
        - name: name
          in: query
          schema:
            type: string
        - name: userLevelFk
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Employee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    put:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Inactivate an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /parents:
    get:
      operationId: listParents
      tags: [parents]
      summary: List parent inventory
      parameters:
        - name: berryId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: pollinationYear
          in: query
          schema:
            type: integer
        - name: spCrosses
          in: query
          schema:
            type: boolean
        - name: selection
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Parent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Parent"
    post:
      operationId: createParent
      tags: [parents]
      summary: Create a parent record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"

  /parents/{id}:
    get:
      operationId: getParent
      tags: [parents]
      summary: Get a parent by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Parent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
    put:
      operationId: updateParent
      tags: [parents]
      summary: Update a parent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parent"
    delete:
      operationId: deleteParent
      tags: [parents]
      summary: Delete a parent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /parents/validate:
    get:
      operationId: validateParent
      tags: [parents]
      summary: Validate a parent selection exists
      parameters:
        - name: selection
          in: query
          required: true
          schema:
            type: string
        - name: berryId
          in: query
          required: true
          schema:
            type: integer
        - name: teamId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentValidation"

  /crosses:
    get:
      operationId: listCrosses
      tags: [crosses]
      summary: List crosses with filters
      parameters:
        - name: berryId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: pollinationYear
          in: query
          schema:
            type: integer
        - name: spCrosses
          in: query
          schema:
            type: boolean
        - name: progeny
          in: query
          schema:
            type: string
        - name: parent
          in: query
          schema:
            type: string
        - name: programId
          in: query
          schema:
            type: integer
        - name: destinationId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
        - name: fumigated
          in: query
          schema:
            type: boolean
        - name: fruitToGo
          in: query
          schema:
            type: boolean
        - name: pollinationToGo
          in: query
          schema:
            type: boolean
        - name: seedSowToGo
          in: query
          schema:
            type: boolean
        - name: sowSeed
          in: query
          schema:
            type: boolean
        - name: acidInDateRange
          in: query
          schema:
            type: boolean
        - name: availablePlants
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Crosses list with pagination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossesListResponse"
    post:
      operationId: createCross
      tags: [crosses]
      summary: Create a cross
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cross"

  /crosses/totals:
    get:
      operationId: getCrossesTotals
      tags: [crosses]
      summary: Get totals for crosses (sums and averages)
      parameters:
        - name: berryId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          schema:
            type: integer
        - name: pollinationYear
          in: query
          schema:
            type: integer
        - name: spCrosses
          in: query
          schema:
            type: boolean
        - name: progeny
          in: query
          schema:
            type: string
        - name: parent
          in: query
          schema:
            type: string
        - name: programId
          in: query
          schema:
            type: integer
        - name: destinationId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: boolean
        - name: fumigated
          in: query
          schema:
            type: boolean
        - name: fruitToGo
          in: query
          schema:
            type: boolean
        - name: pollinationToGo
          in: query
          schema:
            type: boolean
        - name: seedSowToGo
          in: query
          schema:
            type: boolean
        - name: sowSeed
          in: query
          schema:
            type: boolean
        - name: acidInDateRange
          in: query
          schema:
            type: boolean
        - name: availablePlants
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossesTotals"

  /crosses/batch:
    patch:
      operationId: batchUpdateCrosses
      tags: [crosses]
      summary: Batch update inline-editable fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchCrossUpdate"
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                required:
                  - updatedCount

  /crosses/{id}:
    get:
      operationId: getCross
      tags: [crosses]
      summary: Get a cross by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cross
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cross"
    put:
      operationId: updateCross
      tags: [crosses]
      summary: Update a cross
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossInput"
      responses:
